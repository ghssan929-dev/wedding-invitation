
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دعوة زفاف محمد ورقية</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:25px;
 background:linear-gradient(135deg,#102c27,#234b3c,#102c27);
 font-family:Tahoma,Arial,sans-serif;
 color:#f9edcf;
 text-align:center;
}
.card{
 width:100%;
 max-width:520px;
 padding:45px 25px;
 border:2px solid #c9a45b;
 outline:1px solid #c9a45b;
 outline-offset:7px;
 background:rgba(10,25,21,.85);
 box-shadow:0 15px 50px #0008;
}
.small{color:#d5b76f;letter-spacing:2px}
h1{font-size:35px;color:#e5c77f;margin:25px 0}
.names{font-size:27px;line-height:2.1;color:#fff3d2}
.heart{font-size:30px;color:#d7ad62}
.message{font-size:18px;line-height:2.2;margin:25px 0}
.footer{color:#d5b76f;font-size:14px;margin-top:30px}
</style>
</head>
<body>
<div class="card">
 <div class="small">بسم الله الرحمن الرحيم</div>
 <h1>دعوة زفاف</h1>
 <div class="message">
  بكل الحب والفرح نتشرف بدعوتكم لمشاركتنا أجمل لحظات العمر
 </div>
 <div class="names">
  محمد أبكر أحمد علي
  <div class="heart">♥</div>
  رقية عمر بابكر
 </div>
 <div class="message">
  حضوركم يزيد فرحتنا جمالاً<br>
  ووجودكم بيننا أجمل هدية
 </div>
 <div class="footer">
  نتشرف بحضوركم ومشاركتكم فرحتنا
 </div>
</div>
</body>
</html>
